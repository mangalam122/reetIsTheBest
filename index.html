<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{
  height:100dvh;color:#fff;font-family:Fredoka,-apple-system,system-ui,sans-serif;
  background:radial-gradient(130% 90% at 50% 10%,#4a1c6b 0%,#24103f 50%,#0e0620 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));
  text-align:center;position:relative;
}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
h1{
  font-family:"Dancing Script",cursive;font-size:clamp(46px,14vw,74px);line-height:1;position:relative;z-index:2;
  background:linear-gradient(90deg,#ffd54a,#ff8fc4,#ffd54a);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite;filter:drop-shadow(0 4px 14px rgba(255,120,180,.4));
}
@keyframes shine{to{background-position:200% 0}}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
svg#s{width:min(96vw,440px,calc((100dvh - 110px) * .615));height:auto;overflow:visible;transition:transform 1s cubic-bezier(.3,1.2,.5,1);transform-origin:50% 0}
.done svg#s{transform:translateY(-4%) scale(.72)}

/* laptop */
#laptop{transform-origin:200px 600px}
.shake #laptop{animation:shake .45s linear}
@keyframes shake{20%{transform:translate(-4px,2px) rotate(-.6deg)}40%{transform:translate(4px,-2px) rotate(.6deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
#play{cursor:pointer}
#play .pill{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08)}}
.hand-ico{animation:tap 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tap{50%{transform:translateY(-8px)}}
#bar,#barTxt{opacity:0;transition:opacity .3s}
.loading #bar,.loading #barTxt{opacity:1}
.loading #play,.loading #hello{opacity:0;pointer-events:none;transition:opacity .3s}
#flash,#portal,#gift{pointer-events:none}
#flash{opacity:0}
.pop #flash{animation:flash .7s ease-out}
@keyframes flash{30%{opacity:.95}100%{opacity:0}}
#portal{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.pop #portal{animation:portal .5s ease-out forwards}
@keyframes portal{to{opacity:1;transform:scale(1)}}

/* gift coming out of the screen */
#gift{transform-origin:200px 528px;transform:translateY(40px) scale(.04);opacity:0}
.pop #gift{animation:out 1.2s cubic-bezier(.25,1.45,.45,1) .25s forwards}
@keyframes out{0%{opacity:0;transform:translateY(40px) scale(.04)}15%{opacity:1}100%{opacity:1;transform:none}}
.idle #giftIn{animation:bob 3.5s ease-in-out infinite;transform-origin:200px 520px}
@keyframes bob{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-6px)}}

.fl{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-120deg);opacity:0}
.pop .fl{animation:bloom 1.1s cubic-bezier(.3,1.5,.5,1) var(--d) forwards}
@keyframes bloom{to{transform:none;opacity:1}}
.pt{transform:scale(.2,.4)}
.pop .pt{animation:unfurl 1.3s cubic-bezier(.3,1.4,.5,1) var(--d) forwards}
@keyframes unfurl{to{transform:none}}
.stemb{opacity:0}.pop .stemb{animation:bloom .4s 1.1s forwards}
.sw{transform-box:fill-box;transform-origin:50% 100%}
.idle .sw{animation:sway var(--t) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.tw{opacity:0;transform-box:fill-box;transform-origin:center}
.idle .tw{animation:twk 1.8s ease-in-out var(--d) infinite}
@keyframes twk{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

/* message card */
#card{
  position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));width:min(92vw,400px);
  transform:translate(-50%,140%);transition:transform .8s cubic-bezier(.3,1.4,.5,1);z-index:5;
  background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.25);border-radius:24px;padding:16px 18px 18px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
#card.show{transform:translate(-50%,0)}
#card .lvl{font-size:12px;letter-spacing:2px;color:#ffd54a;font-weight:700}
#card p{font-size:15px;line-height:1.4;margin:4px 0 10px}
#card b{font-family:"Dancing Script",cursive;font-size:24px;color:#ffd54a}
.btns{display:flex;gap:12px;justify-content:center;position:relative;height:48px}
.btns button{
  border:0;border-radius:999px;font:700 17px Fredoka,system-ui,sans-serif;padding:12px 26px;cursor:pointer;
  box-shadow:0 6px 0 rgba(0,0,0,.2);
}
#yes{background:linear-gradient(135deg,#ffe066,#ff9ec4);color:#4a0f36}
#no{background:#ffffff33;color:#fff}
#no.run{position:fixed;z-index:6;transition:left .25s,top .25s}
.fx{position:fixed;pointer-events:none;z-index:9;will-change:transform}
.p{top:-30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110dvh) rotate(540deg)}}
.h{font-size:26px;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
</style>
</head>

<script>
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id),body=document.body;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;

for(let i=0;i<40;i++){const s=document.createElement("i");s.className="star";
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*2.4}s;opacity:${.3+Math.random()*.7}`;body.appendChild(s)}

for(let r=0;r<4;r++){const y=582+r*12,xl=44-r*7,xr=356+r*7,n=13,w=(xr-xl)/n;
  for(let k=0;k<n;k++)el("rect",{x:xl+k*w+1,y,width:w-3,height:8,rx:2,fill:"#7d8296"},$("keys"))}
el("rect",{x:130,y:630,width:140,height:6,rx:3,fill:"#7d8296"},$("keys"));

const F=$("flowers"),B=$("back");
function wrap(parent,x,y,d,t){
  const sw=el("g",{class:"sw",style:`--t:${t}s`},parent);
  const fl=el("g",{class:"fl",style:`--d:${d}s`},sw);
  return el("g",{transform:`translate(${x} ${y})`},fl);
}
function sunflower(x,y,r,tilt,d){d-=.9;
  const g=el("g",{transform:`rotate(${tilt}) scale(1 .93)`},wrap(F,x,y,d,3+rnd()*2));
  [[20,1,"spD",0],[20,.88,"spL",9]].forEach(([n,len,gr,off])=>{
    const ring=el("g",{class:"pt",style:`--d:${d+.15}s`},g),L=r*len,w=r*.17;
    for(let i=0;i<n;i++){const p=el("g",{transform:`rotate(${i*360/n+off})`},ring);
      el("path",{d:`M0 ${-r*.3}C${w} ${-L*.45} ${w*.9} ${-L*.85} 0 ${-L}C${-w*.9} ${-L*.85} ${-w} ${-L*.45} 0 ${-r*.3}Z`,fill:`url(#${gr})`},p);
      el("path",{d:`M0 ${-r*.42}L0 ${-L*.82}`,stroke:"#b85c00","stroke-opacity":.35,"stroke-width":1},p)}
  });
  const R=r*.4;el("circle",{r:R+2,fill:"#3a2008"},g);el("circle",{r:R,fill:"url(#disc)"},g);
  for(let i=1,n=130;i<n;i++){const a=i*2.39996,dd=R*.94*Math.sqrt(i/n);
    el("circle",{cx:Math.cos(a)*dd,cy:Math.sin(a)*dd,r:R*.035*(.7+i/n),fill:i%3?"#1a0c03":"#a0742c",opacity:.85},g)}
  el("ellipse",{cx:-R*.3,cy:-R*.35,rx:R*.45,ry:R*.25,fill:"#fff",opacity:.1},g);
}
function lily(x,y,r,rot,d,c){d-=.9;
  const g=el("g",{transform:`rotate(${rot}) scale(1 .86)`},wrap(F,x,y,d,3+rnd()*2));
  const P=`M0 0C${r*.34} ${-r*.12} ${r*.36} ${-r*.6} ${r*.07} ${-r*.94}Q0 ${-r*1.04} ${-r*.07} ${-r*.94}C${-r*.36} ${-r*.6} ${-r*.34} ${-r*.12} 0 0Z`;
  const pink=c=="P";
  [[30,1,c+"2"],[150,1,c+"2"],[270,1,c+"2"],[90,.92,c],[210,.92,c],[330,.92,c]].forEach(([a,s,gr],i)=>{
    const o=el("g",{transform:`rotate(${a}) scale(${s})`},g),p=el("g",{class:"pt",style:`--d:${d+.1+i*.05}s`},o);
    el("path",{d:P,fill:`url(#l${gr})`,stroke:pink?"#c2185b":"#d9c9a0","stroke-opacity":.35,"stroke-width":1},p);
    el("path",{d:`M0 ${-r*.08}Q${r*.03} ${-r*.5} 0 ${-r*.88}`,stroke:pink?"#b0124f":"#c9d98a","stroke-opacity":.45,"stroke-width":1.4,fill:"none"},p);
    el("path",{d:`M${r*.06} ${-r*.2}Q${r*.2} ${-r*.5} ${r*.06} ${-r*.8}`,stroke:"#fff","stroke-opacity":.5,"stroke-width":1.5,fill:"none"},p);
    if(pink)for(let k=0;k<6;k++)el("circle",{cx:(k%2?1:-1)*r*(.06+.04*(k%3)),cy:-r*(.18+k*.06),r:1.3,fill:"#8a0a3c",opacity:.7},p);
  });
  for(let i=0;i<6;i++){const a=(i*60)*Math.PI/180,ex=Math.cos(a)*r*.55,ey=Math.sin(a)*r*.55;
    el("path",{d:`M0 0Q${ex*.4+ey*.15} ${ey*.4-ex*.15} ${ex} ${ey}`,stroke:"#e8f5c8","stroke-width":1.6,fill:"none"},g);
    el("ellipse",{cx:ex,cy:ey,rx:5,ry:2.2,fill:"#a8420f",transform:`rotate(${i*60+90} ${ex} ${ey})`},g)}
  el("path",{d:`M0 0L${r*.08} ${-r*.62}`,stroke:"#c5e07a","stroke-width":2.2},g);
  el("circle",{cx:r*.08,cy:-r*.62,r:3.2,fill:"#7cb342"},g);
}
function leaf(x,y,a,d,s=1){d-=.9;
  const g=wrap(B,x,y,d,4+rnd()*2),t=el("g",{transform:`rotate(${a}) scale(${s})`},g);
  el("path",{d:"M0 0C18 -26 52 -30 78 -8C52 -2 22 8 0 0Z",fill:"url(#leaf)"},t);
  el("path",{d:"M2 -1Q40 -12 74 -8",stroke:"#cdeaa8","stroke-opacity":.6,"stroke-width":1.3,fill:"none"},t);
}
function bud(x,y,a,d){d-=.9;
  el("path",{d:`M200 245 Q${(200+x)/2} ${y+40} ${x} ${y}`,stroke:"#4c9a3a","stroke-width":3,fill:"none",class:"stemb"},B);
  const t=el("g",{transform:`rotate(${a})`},wrap(B,x,y,d,3));
  el("ellipse",{cx:0,cy:-20,rx:8,ry:22,fill:"url(#bud)"},t);
  el("path",{d:"M-7 -4Q0 -16 7 -4Q0 2 -7 -4Z",fill:"#5a9e34"},t);
}
function breath(x,y,d){d-=.9;
  const t=wrap(B,x,y,d,3.5);
  for(let i=0;i<8;i++){const a=rnd()*6.28,dd=rnd()*12;
    el("line",{x1:0,y1:10,x2:Math.cos(a)*dd,y2:Math.sin(a)*dd,stroke:"#7cb342","stroke-width":.8},t);
    el("circle",{cx:Math.cos(a)*dd,cy:Math.sin(a)*dd,r:2.4+rnd()*1.5,fill:"#fff",stroke:"#ffd0e4","stroke-width":.6},t)}
}

leaf(150,250,-150,1.6);leaf(250,250,-30,1.65);leaf(112,190,-178,1.7,.9);leaf(290,190,-2,1.75,.9);
leaf(170,120,-110,1.8,.8);leaf(232,118,-70,1.85,.8);
bud(78,78,-30,2.0);bud(322,74,30,2.05);
[[58,150],[342,150],[150,64],[252,64],[126,250],[276,250],[96,108],[306,104]].forEach((p,i)=>breath(p[0],p[1],2.1+i*.05));
lily(200,72,46,0,2.0,"P");
sunflower(122,140,48,-12,2.15);
sunflower(280,138,50,12,2.25);
lily(92,214,46,-38,2.35,"W");
lily(308,212,46,38,2.45,"P");
sunflower(200,186,60,0,2.55);
[[40,40],[360,46],[20,240],[380,236],[200,-10],[110,10],[300,12]].forEach(([x,y],i)=>
  el("use",{href:"#spark",class:"tw",transform:`translate(${x} ${y})`,style:`--d:${i*.3}s`},$("twinkles")));

function fx(cls,txt,x,y,css){const s=document.createElement("span");s.className="fx "+cls;s.textContent=txt;
  s.style.left=x+"px";s.style.top=y+"px";for(const k in css||{})s.style.setProperty(k,css[k]);body.appendChild(s);setTimeout(()=>s.remove(),6500)}
function rain(n){for(let i=0;i<n;i++)setTimeout(()=>fx("p",["🌻","🌸","💛","✨"][i%4],Math.random()*innerWidth,-30,
  {"animation-duration":3+Math.random()*3+"s","font-size":14+Math.random()*14+"px"}),i*110)}
function burst(x,y,n,set,spread){for(let i=0;i<n;i++){const a=Math.random()*6.28,d=spread*(.5+Math.random()*.6);
  fx("h",set[i%set.length],x-13,y-13,{"--x":Math.cos(a)*d+"px","--y":Math.sin(a)*d+"px","animation-delay":Math.random()*.25+"s"})}}

let started=false;
$("play").addEventListener("click",()=>{
  if(started)return;started=true;body.classList.add("loading");
  let p=0;const t=setInterval(()=>{p=Math.min(100,p+Math.ceil(Math.random()*7));
    $("fill").setAttribute("width",2.2*p);$("barTxt").textContent=p<100?`Sending sorry… ${p}%`:"Sorry delivered 💖";
    if(p>=100){clearInterval(t);setTimeout(go,350)}},60);
});
function go(){
  body.classList.add("pop","shake");$("barTxt").style.opacity=0;$("bar").style.opacity=0;
  const r=$("s").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.4;
  setTimeout(()=>burst(cx,cy,26,["✨","💛","⭐","💖"],180),900);
  setTimeout(()=>body.classList.add("idle"),3800);
  setTimeout(()=>rain(30),2600);
  setTimeout(()=>{$("card").classList.add("show");body.classList.add("done")},4200);
}
$("yes").onclick=e=>{burst(e.clientX,e.clientY,30,["💛","💖","🌻","💕","🌸"],220);
  $("yes").textContent="Yay! Love you 💛";$("no").style.display="none";rain(40)};
const no=$("no");
const flee=e=>{e.preventDefault();no.classList.add("run");
  no.style.left=20+Math.random()*(innerWidth-140)+"px";no.style.top=60+Math.random()*(innerHeight*.5)+"px";
  no.textContent=["No","Sure? 🥺","pls 🥹","wrong button","try Yes 💛"][Math.floor(Math.random()*5)]};
no.addEventListener("touchstart",flee,{passive:false});no.addEventListener("mouseenter",flee);no.addEventListener("click",flee);
</script>
