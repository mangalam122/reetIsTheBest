<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0f24">
<title>Sorry Reet 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100dvh;overflow-x:hidden;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,#5c1f4a 0%,#2a0f24 55%,#140712 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  text-align:center;
}
h1{
  font-family:"Dancing Script",cursive;font-size:clamp(44px,13vw,72px);line-height:1.05;
  background:linear-gradient(90deg,#ffd54a,#ff9ec4,#ffd54a);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 4s linear infinite;filter:drop-shadow(0 4px 14px rgba(255,120,180,.35));
}
@keyframes shine{to{background-position:200% 0}}
.sub{opacity:.85;margin-top:6px;font-size:15px}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px}
#go,#yes{
  margin-top:28px;border:0;cursor:pointer;font-size:20px;font-weight:600;color:#3a1030;
  padding:16px 30px;border-radius:999px;
  background:linear-gradient(135deg,#ffe066,#ffb3d1);
  box-shadow:0 10px 30px rgba(255,150,200,.45),inset 0 -3px 0 rgba(0,0,0,.12);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{50%{transform:scale(1.06)}}
.arrow{font-size:46px;margin-top:22px;animation:bob 1s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(10px)}}
#bq{display:none;width:min(90vw,420px,50dvh);height:auto;transform-style:preserve-3d;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-10deg) rotateX(4deg)}50%{transform:rotateY(10deg) rotateX(4deg)}}
.on #bq{display:block}
.on #intro{display:none}
.stem{stroke-dasharray:1;stroke-dashoffset:1}
.on .stem{animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fl,.wrap,.bow{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0}
.on .wrap{animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
.on .fl{animation:bloom 1s cubic-bezier(.3,1.5,.5,1) forwards}
.on .bow{animation:pop .6s cubic-bezier(.3,1.6,.5,1) 2.4s forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes bloom{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#msg{opacity:0;transform:translateY(12px);transition:1s;margin-top:10px;font-size:17px;line-height:1.5;max-width:340px}
#msg b{font-family:"Dancing Script",cursive;font-size:26px;color:#ffd54a}
.show{opacity:1!important;transform:none!important}
#yes{margin-top:14px;padding:12px 26px;font-size:17px;animation:none}
.p{position:fixed;top:-30px;pointer-events:none;font-size:20px;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110dvh) rotate(540deg)}}
.h{position:fixed;pointer-events:none;font-size:26px;animation:up 1.6s ease-out forwards;z-index:9}
@keyframes up{to{transform:translate(var(--x),-60vh) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){#bq{animation:none}}
</style>
</head>
<body>
<h1>Sorry Reet</h1>
<p class="sub">I made you something… 🥺</p>

<div class="stage" id="stage">
  <div id="intro">
    <span class="arrow">👇</span>
    <button id="go">Tap here ➜ 💐</button>
  </div>

  <svg id="bq" viewBox="0 0 400 540" aria-label="Bouquet of sunflowers and lilies">
    <defs>
      <radialGradient id="sp" cx="50%" cy="85%" r="80%">
        <stop offset="0" stop-color="#ff9f00"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#fff07a"/>
      </radialGradient>
      <radialGradient id="sc" cx="40%" cy="35%" r="70%">
        <stop offset="0" stop-color="#8a5a2b"/><stop offset=".6" stop-color="#4a2a12"/><stop offset="1" stop-color="#2a1608"/>
      </radialGradient>
      <linearGradient id="lp" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ff4f9a"/><stop offset=".45" stop-color="#ff9cc7"/><stop offset="1" stop-color="#fff4f8"/>
      </linearGradient>
      <linearGradient id="lw" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#ffe680"/><stop offset=".4" stop-color="#fffdf2"/><stop offset="1" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="st" x1="0" x2="1">
        <stop offset="0" stop-color="#2f7d32"/><stop offset=".5" stop-color="#66bb6a"/><stop offset="1" stop-color="#2f7d32"/>
      </linearGradient>
      <linearGradient id="wp" x1="0" x2="1">
        <stop offset="0" stop-color="#c2185b"/><stop offset=".35" stop-color="#f48fb1"/><stop offset=".6" stop-color="#fce4ec"/><stop offset="1" stop-color="#ad1457"/>
      </linearGradient>
      <linearGradient id="wp2" x1="0" x2="1">
        <stop offset="0" stop-color="#f8bbd0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#f8bbd0"/>
      </linearGradient>
      <pattern id="seeds" width="5" height="5" patternUnits="userSpaceOnUse">
        <circle cx="2.5" cy="2.5" r="1" fill="#1a0d04" opacity=".7"/>
      </pattern>
    </defs>
    <g id="stems"></g>
    <g id="leaves"></g>
    <path class="wrap" d="M60 250 L200 530 L340 250 Q300 285 270 262 Q240 292 200 266 Q160 292 130 262 Q100 285 60 250Z" fill="url(#wp)" style="animation-delay:.1s"/>
    <path class="wrap" d="M105 300 L200 530 L295 300 Q250 330 200 312 Q150 330 105 300Z" fill="url(#wp2)" opacity=".55" style="animation-delay:.2s"/>
    <g id="flowers"></g>
    <g class="bow">
      <path d="M200 430 C160 400 140 440 168 452 C180 456 192 444 200 430Z M200 430 C240 400 260 440 232 452 C220 456 208 444 200 430Z" fill="#ffd54a" stroke="#e6a800" stroke-width="2"/>
      <path d="M196 432 L180 490 L192 486 L200 498 L204 432Z M204 432 L222 488 L210 486 L200 498Z" fill="#ffca28"/>
      <circle cx="200" cy="432" r="9" fill="#ffb300"/>
    </g>
  </svg>

  <p id="msg">I'm really sorry, <b>Reet</b>.<br>Sunflowers because you're my sunshine 🌻<br>Lilies because you're the prettiest 🌸<br>Forgive me? 🥹</p>
  <button id="yes" style="display:none" class="btn">Yes 💛</button>
</div>

<script>
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};

function sunflower(x,y,r,d){
  const g=el("g",{class:"fl",style:`animation-delay:${d}s`},$("flowers"));
  const t=el("g",{transform:`translate(${x} ${y})`},g);
  for(let ring=0;ring<2;ring++)for(let i=0;i<16;i++){
    el("ellipse",{cx:0,cy:-r*.68,rx:r*.17,ry:r*.42,fill:"url(#sp)",
      transform:`rotate(${i*22.5+ring*11.25})`,opacity:ring?1:.85},t);
  }
  el("circle",{r:r*.42,fill:"url(#sc)"},t);
  el("circle",{r:r*.42,fill:"url(#seeds)"},t);
  el("circle",{r:r*.16,cx:-r*.12,cy:-r*.12,fill:"#fff",opacity:.12},t);
}
function lily(x,y,r,rot,d,grad){
  const g=el("g",{class:"fl",style:`animation-delay:${d}s`},$("flowers"));
  const t=el("g",{transform:`translate(${x} ${y}) rotate(${rot})`},g);
  const P=`M0 0 C${r*.38} ${-r*.3} ${r*.3} ${-r*.8} 0 ${-r} C${-r*.3} ${-r*.8} ${-r*.38} ${-r*.3} 0 0Z`;
  [30,150,270,90,210,330].forEach((a,i)=>{
    const pg=el("g",{transform:`rotate(${a}) scale(${i<3?1:.9})`},t);
    el("path",{d:P,fill:`url(#${grad})`,stroke:"rgba(180,40,100,.25)","stroke-width":1},pg);
    el("path",{d:`M0 ${-r*.1} L0 ${-r*.85}`,stroke:"rgba(200,40,110,.35)","stroke-width":1.2},pg);
    for(let k=0;k<4;k++)el("circle",{cx:(k%2?3:-3),cy:-r*(.2+k*.08),r:1.2,fill:"#b0124f",opacity:.6},pg);
  });
  for(let i=0;i<6;i++){
    const a=(i*60+15)*Math.PI/180,ex=Math.cos(a)*r*.45,ey=Math.sin(a)*r*.45;
    el("line",{x1:0,y1:0,x2:ex,y2:ey,stroke:"#c5e1a5","stroke-width":1.5},t);
    el("ellipse",{cx:ex,cy:ey,rx:4,ry:2,fill:"#e65100",transform:`rotate(${i*60+15} ${ex} ${ey})`},t);
  }
}
function stem(x,y,bend){
  el("path",{class:"stem",pathLength:1,d:`M200 470 Q${(200+x)/2+bend} ${(470+y)/2} ${x} ${y}`,
    stroke:"url(#st)","stroke-width":5,fill:"none","stroke-linecap":"round"},$("stems"));
}
function leaf(x,y,a,d){
  const g=el("g",{class:"fl",style:`animation-delay:${d}s`},$("leaves"));
  el("path",{d:"M0 0 C20 -18 50 -14 62 0 C50 14 20 18 0 0Z",fill:"#43a047",stroke:"#2e7d32","stroke-width":1.5,
    transform:`translate(${x} ${y}) rotate(${a})`},g);
}

// layout: [type, x, y, size, rotation, gradient]
const F=[
  ["l",95,215,52,-20,"lp"],["l",305,215,52,20,"lw"],
  ["s",140,150,58],["s",262,145,60],
  ["l",200,85,50,0,"lp"],["l",75,130,42,-30,"lw"],["l",325,125,42,30,"lp"],
  ["s",200,195,66],
];
F.forEach(f=>stem(f[1],f[2],(f[1]-200)*-.15));
leaf(110,250,-150,1.2);leaf(290,250,-30,1.25);leaf(70,190,-160,1.3);leaf(330,185,-20,1.35);
F.forEach((f,i)=>{const d=1+i*.18;f[0]=="s"?sunflower(f[1],f[2],f[3],d):lily(f[1],f[2],f[3],f[4],d,f[5])});

function rain(n,chars){for(let i=0;i<n;i++)setTimeout(()=>{
  const s=document.createElement("span");s.className="p";s.textContent=chars[i%chars.length];
  s.style.left=Math.random()*100+"vw";s.style.animationDuration=3+Math.random()*3+"s";
  s.style.fontSize=14+Math.random()*16+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),6500)},i*120)}

$("go").onclick=()=>{
  document.body.classList.add("on");
  rain(30,["🌻","🌸","💛","🌼"]);
  setTimeout(()=>{$("msg").classList.add("show");$("yes").style.display="inline-block";$("yes").classList.add("show")},3000);
};
$("yes").onclick=e=>{
  for(let i=0;i<24;i++){const h=document.createElement("span");h.className="h";h.textContent=["💛","💖","🌻","💕"][i%4];
    h.style.left=e.clientX+"px";h.style.top=e.clientY+"px";h.style.setProperty("--x",(Math.random()*240-120)+"px");
    h.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),2200)}
  $("yes").textContent="Love you 💛";
};
</script>
</body>
</html>
